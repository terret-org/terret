name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The docker suite runs live here rather than skipping, so M7's
      # acceptance — one patch row moves the execution world into a container —
      # stays exercised in CI. Pulling the image up front keeps the first
      # container test from paying for it.
      - name: Pull the sandbox image
        run: docker pull ruby:slim

      - name: Test suites
        run: bundle exec rake test

      # The dispatch mode of every event is public contract. docs/events.md is
      # generated, so a drifted catalog means someone changed a contract
      # without saying so.
      - name: Event catalog is current
        run: |
          bundle exec rake events:catalog
          git diff --exit-code docs/events.md

      # Every service's config surface is public contract too. docs/config-catalog.md
      # is generated from each service's Hames::Schema, so a config key that
      # changes shape shows up in review rather than in a support thread.
      - name: Config catalog is current
        run: |
          bundle exec rake config:catalog
          git diff --exit-code docs/config-catalog.md
